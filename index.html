<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Falcon | Sequence Initiation</title>
    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-dark: #030305;
            --falcon-red: #ff003c;
            --falcon-blue: #00d2ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* إلغاء السكرول تماماً وثبات الصفحة على حجم الشاشة أياً كانت */
        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-dark);
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }

        body {
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* ==========================================================================
           1. SPEED OF LIGHT BACKGROUND 
           ========================================================================== */
        #light-speed-bg {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 1;
            opacity: 0;
            background-color: var(--bg-dark);
            transform: rotate(-45deg);
            pointer-events: none;
        }

        .streak {
            position: absolute;
            width: 150px;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--falcon-blue), transparent);
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0;
        }

        .streak.red {
            background: linear-gradient(90deg, transparent, var(--falcon-red), transparent);
            height: 6px;
            filter: blur(2px);
        }

        /* ==========================================================================
           2. PRELOADER CONTAINER
           ========================================================================== */
        #preloader {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        /* ==========================================================================
           3. FALCON WORD IMAGE (Fully Responsive & Untouched)
           ========================================================================== */
        #falcon-image-container {
            position: relative;
            width: min(85vw, 550px); /* يتاقلم بذكاء مع الموبايل واللابتوب */
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: 77% 50%; 
            opacity: 0;
        }

        #falcon-image-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4));
        }

        /* ==========================================================================
           4. CLEAN SVG LOADER
           ========================================================================== */
        #loader-container {
            margin-top: 25px;
            width: 45px;
            height: 45px;
            opacity: 0;
            z-index: 10;
        }

        .spinner {
            animation: rotate 2s linear infinite;
            width: 100%;
            height: 100%;
        }

        .path {
            stroke: var(--falcon-blue);
            stroke-linecap: round;
            animation: dash 1.5s ease-in-out infinite;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        @keyframes dash {
            0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
            100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
        }
    </style>
</head>
<body>

    <!-- Speed of Light Background Lines -->
    <div id="light-speed-bg"></div>

    <!-- Preloader UI -->
    <div id="preloader">
        
        <!-- FALCON Image (Original transparent Word.png) -->
        <div id="falcon-image-container">
            <img src="icon/Word.png" alt="Falcon" class="notranslate" translate="no">[span_0](start_span)[span_0](end_span)[span_1](start_span)[span_1](end_span)
        </div>

        <!-- Loader -->
        <div id="loader-container">
            <svg class="spinner" viewBox="0 0 50 50">
                <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
            </svg>
        </div>
    </div>

    <script>
        const falconContainer = document.getElementById('falcon-image-container');
        const loaderContainer = document.getElementById('loader-container');
        const lightSpeedBg = document.getElementById('light-speed-bg');
        
        let loadProgress = 0;

        // 1. Generate Speed of Light Streaks
        function createStreaks() {
            for(let i = 0; i < 80; i++) {
                let streak = document.createElement('div');
                streak.classList.add('streak');
                if(Math.random() > 0.5) streak.classList.add('red');
                
                streak.style.top = Math.random() * 100 + '%';
                streak.style.left = '-20%'; 
                
                lightSpeedBg.appendChild(streak);
            }
        }
        createStreaks();

        // 2. Smooth entry animation on page load
        window.onload = () => {
            gsap.to(falconContainer, { opacity: 1, duration: 1.2, ease: "power2.out" });
            gsap.to(loaderContainer, { opacity: 1, duration: 0.8, delay: 0.3, ease: "power2.out" });

            setTimeout(simulateLoading, 600); 
        };

        // 3. Loading Simulation 
        function simulateLoading() {
            const interval = setInterval(() => {
                loadProgress += Math.floor(Math.random() * 5) + 2; 
                
                if (loadProgress >= 100) {
                    loadProgress = 100;
                    clearInterval(interval);
                    setTimeout(triggerHyperJump, 300); 
                }
            }, 80);
        }

        // 4. Hyper-Jump: Zooming directly through the image center/O
        function triggerHyperJump() {
            const tl = gsap.timeline({
                onComplete: () => {
                    console.log("Hyper-jump completed successfully.");
                }
            });

            // Hide the loader smoothly
            tl.to(loaderContainer, {
                y: 20,
                opacity: 0,
                duration: 0.4
            }, 0);

            // Ignite background light-speed streaks
            tl.to(lightSpeedBg, {
                opacity: 1,
                duration: 0.5
            }, 0.2);

            // MASSIVE ZOOM THROUGH THE IMAGE
            tl.to(falconContainer, {
                scale: 70,
                opacity: 0, 
                duration: 1.5,
                ease: "power4.in"
            }, 0);

            // Animate light streaks rushing by
            const allStreaks = document.querySelectorAll('.streak');
            allStreaks.forEach((streak) => {
                gsap.to(streak, {
                    x: window.innerWidth * 2.5,
                    duration: Math.random() * 1.2 + 0.3,
                    ease: "none",
                    repeat: -1,
                    delay: Math.random() * 1.5
                });
            });
        }
    </script>
</body>
</html>
