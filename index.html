<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Falcon | Sequence Initiation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-dark: #030305;
            --falcon-blue: #00d2ff;
            --falcon-red: #ff003c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* إلغاء التمرير وثبات الشاشة تماماً */
        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-dark);
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }

        body {
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', Impact, sans-serif;
        }

        /* الحاوية العامة في منتصف الشاشة */
        #preloader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        /* صورة كلمة فالكون */
        #falcon-image-container {
            width: min(85vw, 480px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
        }

        #falcon-image-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4));
        }

        /* ==========================================================================
           الأرقام الصافية فقط (بدون أي مستطيلات أو إطارات)
           ========================================================================== */
        #gear-counter {
            display: flex;
            align-items: center;
            gap: 2px;
            opacity: 0;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        /* شباك عرض الرقم (مخفي ما يخرج عن الإطار لتأثير الحركة) */
        .digit-drum {
            position: relative;
            width: 34px;
            height: 48px;
            overflow: hidden;
            text-align: center;
            background: transparent;
            border: none;
        }

        /* شريط الأرقام المتحرك رأسياً */
        .drum-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .drum-num {
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: 900;
            color: var(--falcon-blue);
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.7);
        }

        .percent-symbol {
            font-size: 24px;
            font-weight: 900;
            color: var(--falcon-red);
            margin-left: 4px;
            text-shadow: 0 0 12px rgba(255, 0, 60, 0.7);
        }
    </style>
</head>
<body>

    <div id="preloader">
        <!-- كلمة فالكون الشفافة -->
        <div id="falcon-image-container">
            <img src="icon/Word.png" alt="Falcon" class="notranslate" translate="no">
        </div>

        <!-- الأرقام الميكانيكية الصافية بدون أي مربعات أو خلفيات -->
        <div id="gear-counter">
            <!-- خانة المئات -->
            <div class="digit-drum" id="drum-hundreds">
                <div class="drum-strip" style="transform: translateY(0px);">
                    <div class="drum-num">0</div><div class="drum-num">1</div>
                </div>
            </div>
            <!-- خانة العشرات -->
            <div class="digit-drum" id="drum-tens">
                <div class="drum-strip" style="transform: translateY(0px);">
                    <div class="drum-num">0</div><div class="drum-num">1</div><div class="drum-num">2</div><div class="drum-num">3</div><div class="drum-num">4</div><div class="drum-num">5</div><div class="drum-num">6</div><div class="drum-num">7</div><div class="drum-num">8</div><div class="drum-num">9</div>
                </div>
            </div>
            <!-- خانة الآحاد -->
            <div class="digit-drum" id="drum-units">
                <div class="drum-strip" style="transform: translateY(0px);">
                    <div class="drum-num">0</div><div class="drum-num">1</div><div class="drum-num">2</div><div class="drum-num">3</div><div class="drum-num">4</div><div class="drum-num">5</div><div class="drum-num">6</div><div class="drum-num">7</div><div class="drum-num">8</div><div class="drum-num">9</div>
                </div>
            </div>
            <span class="percent-symbol">%</span>
        </div>
    </div>

    <script>
        const falconContainer = document.getElementById('falcon-image-container');
        const gearCounter = document.getElementById('gear-counter');

        const drumHundreds = document.querySelector('#drum-hundreds .drum-strip');
        const drumTens = document.querySelector('#drum-tens .drum-strip');
        const drumUnits = document.querySelector('#drum-units .drum-strip');

        drumHundreds.innerHTML = '';
        for (let i = 0; i <= 1; i++) {
            drumHundreds.innerHTML += `<div class="drum-num">${i}</div>`;
        }

        function updateCounter(val) {
            let strVal = val.toString().padStart(3, '0');
            
            let h = parseInt(strVal[0]);
            let t = parseInt(strVal[1]);
            let u = parseInt(strVal[2]);

            drumHundreds.style.transform = `translateY(-${h * 48}px)`;
            drumTens.style.transform = `translateY(-${t * 48}px)`;
            drumUnits.style.transform = `translateY(-${u * 48}px)`;
        }

        window.onload = () => {
            gsap.to(falconContainer, { opacity: 1, duration: 1, ease: "power2.out" });
            gsap.to(gearCounter, { opacity: 1, duration: 0.8, delay: 0.3, ease: "power2.out" });

            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 3) + 1;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                }
                updateCounter(progress);
            }, 70);
        };
    </script>
</body>
</html>
