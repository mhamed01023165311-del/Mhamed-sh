<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Falcon | Sequence Initiation</title>
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Lottie Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        :root {
            --bg-dark: #030305;
            --falcon-red: #ff003c;
            --falcon-blue: #00d2ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Arial Black', Impact, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* ==========================================================================
           1. SPEED OF LIGHT BACKGROUND 
           ========================================================================== */
        #light-speed-bg {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 1;
            opacity: 0;
            background-color: var(--bg-dark);
            transform: rotate(-45deg);
            pointer-events: none;
        }

        .streak {
            position: absolute;
            width: 150px;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--falcon-blue), transparent);
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0;
        }

        .streak.red {
            background: linear-gradient(90deg, transparent, var(--falcon-red), transparent);
            height: 6px;
            filter: blur(2px);
        }

        /* ==========================================================================
           2. PRELOADER CONTAINER
           ========================================================================== */
        #preloader {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        /* ==========================================================================
           3. FALCON TEXT (Responsive & Smooth Fade-In)
           ========================================================================== */
        #falcon-word {
            /* Responsive font size based on screen width so it fits any device perfectly */
            font-size: clamp(3rem, 12vw, 9rem);
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            position: relative;
            
            /* Target the center of 'O' for zoom */
            transform-origin: 77% 50%; 
            
            background-image: url('icon/Word.png');[span_0](start_span)[span_0](end_span)[span_1](start_span)[span_1](end_span)
            background-size: cover;
            background-position: center;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            
            opacity: 0; /* Starts hidden for the smooth fade-in */
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4));
        }

        /* ==========================================================================
           4. LOTTIE ANIMATION CONTAINER (icon/download.json)
           ========================================================================== */
        #animation-container {
            margin-top: 20px;
            width: 100px;
            height: 100px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; /* Starts hidden for smooth entry */
        }
    </style>
</head>
<body>

    <!-- Speed of Light Background Lines -->
    <div id="light-speed-bg"></div>

    <!-- Preloader UI -->
    <div id="preloader">
        
        <!-- FALCON Text -->
        <div id="falcon-word" class="notranslate" translate="no">
            FALCON
        </div>

        <!-- Lottie Animation Loader -->
        <div id="animation-container">
            <lottie-player 
                id="lottie-loader"
                src="icon/download.json[span_2](start_span)[span_3](start_span)"[span_2](end_span)[span_3](end_span)
                background="transparent" 
                speed="1" 
                style="width: 100%; height: 100%;" 
                loop 
                autoplay>
            </lottie-player>
        </div>
    </div>

    <script>
        const falconWord = document.getElementById('falcon-word');
        const animContainer = document.getElementById('animation-container');
        const lightSpeedBg = document.getElementById('light-speed-bg');
        
        let loadProgress = 0;

        // 1. Generate Speed of Light Streaks
        function createStreaks() {
            for(let i = 0; i < 80; i++) {
                let streak = document.createElement('div');
                streak.classList.add('streak');
                if(Math.random() > 0.5) streak.classList.add('red');
                
                streak.style.top = Math.random() * 100 + '%';
                streak.style.left = '-20%'; 
                
                lightSpeedBg.appendChild(streak);
            }
        }
        createStreaks();

        // 2. Smooth entry animation on page load
        window.onload = () => {
            // Fade in the FALCON word and the loading icon smoothly (Classy appearance)
            gsap.to(falconWord, { opacity: 1, duration: 1.5, ease: "power2.out" });
            gsap.to(animContainer, { opacity: 1, duration: 1, delay: 0.5, ease: "power2.out" });

            setTimeout(simulateLoading, 800); 
        };

        // 3. Loading Logic 
        function simulateLoading() {
            const interval = setInterval(() => {
                loadProgress += Math.floor(Math.random() * 4) + 1; 
                
                if (loadProgress >= 100) {
                    loadProgress = 100;
                    clearInterval(interval);
                    setTimeout(triggerHyperJump, 300); 
                }
            }, 90);
        }

        // 4. Hyper-Jump: Zooming directly through the 'O' in FALCON
        function triggerHyperJump() {
            const tl = gsap.timeline({
                onComplete: () => {
                    console.log("Hyper-jump through 'O' completed successfully.");
                }
            });

            // Hide the Lottie animation smoothly
            tl.to(animContainer, {
                y: 20,
                opacity: 0,
                duration: 0.4
            }, 0);

            // Ignite background light-speed streaks
            tl.to(lightSpeedBg, {
                opacity: 1,
                duration: 0.5
            }, 0.2);

            // MASSIVE ZOOM THROUGH THE 'O'
            tl.to(falconWord, {
                scale: 70,
                opacity: 0, 
                duration: 1.5,
                ease: "power4.in"
            }, 0);

            // Animate light streaks rushing by
            const allStreaks = document.querySelectorAll('.streak');
            allStreaks.forEach((streak) => {
                gsap.to(streak, {
                    x: window.innerWidth * 2.5,
                    duration: Math.random() * 1.2 + 0.3,
                    ease: "none",
                    repeat: -1,
                    delay: Math.random() * 1.5
                });
            });
        }
    </script>
</body>
</html>
