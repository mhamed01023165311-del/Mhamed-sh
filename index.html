<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Falcon | Sequence Initiation</title>
    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Lottie Player to render your download.json animation -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        :root {
            --bg-dark: #030305;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* إلغاء التمرير تماماً وثبات الشاشة */
        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-dark);
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }

        body {
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* حاوية التحميل والتوسيط */
        #preloader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* صورة كلمة FALCON متسنترة وفي المنتصف تماماً */
        #falcon-image-container {
            position: relative;
            width: min(85vw, 500px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
        }

        #falcon-image-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4));
        }

        /* حاوية ملف الـ download.json أسفل الكلمة */
        #loader-container {
            margin-top: 30px;
            width: 80px;
            height: 80px;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="preloader">
        <!-- صورة كلمة فالكون -->
        <div id="falcon-image-container">
            <img src="icon/Word.png" alt="Falcon" class="notranslate" translate="no">
        </div>

        <!-- ملف الأنيميشن الخاص بك (download.json) -->
        <div id="loader-container">
            <lottie-player 
                src="icon/download.json"
                background="transparent" 
                speed="1" 
                style="width: 100%; height: 100%;" 
                loop 
                autoplay>
            </lottie-player>
        </div>
    </div>

    <script>
        const falconContainer = document.getElementById('falcon-image-container');
        const loaderContainer = document.getElementById('loader-container');

        // ظهور ناعم للعناصر عند فتح الصفحة
        window.onload = () => {
            gsap.to(falconContainer, { opacity: 1, duration: 1, ease: "power2.out" });
            gsap.to(loaderContainer, { opacity: 1, duration: 0.8, delay: 0.3, ease: "power2.out" });
        };
    </script>
</body>
</html>
