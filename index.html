<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Falcon | Brand Identity</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="light-speed-bg"></div>

    <!-- شاشة التحميل -->
    <div id="preloader">
        <div class="preload-word" id="preloadWord">
            <img src="icon/Word.png" alt="Falcon" class="notranslate" translate="no">
        </div>

        <div id="gear-counter">
            <div class="digit-drum" id="drum-hundreds">
                <div class="drum-strip" style="transform: translateY(0px);">
                    <div class="drum-num">1</div>
                </div>
            </div>
            <div class="digit-drum" id="drum-tens">
                <div class="drum-strip" style="transform: translateY(0px);">
                    <div class="drum-num">0</div><div class="drum-num">1</div><div class="drum-num">2</div><div class="drum-num">3</div><div class="drum-num">4</div><div class="drum-num">5</div><div class="drum-num">6</div><div class="drum-num">7</div><div class="drum-num">8</div><div class="drum-num">9</div>
                </div>
            </div>
            <div class="digit-drum" id="drum-units">
                <div class="drum-strip" style="transform: translateY(0px);">
                    <div class="drum-num">0</div><div class="drum-num">1</div><div class="drum-num">2</div><div class="drum-num">3</div><div class="drum-num">4</div><div class="drum-num">5</div><div class="drum-num">6</div><div class="drum-num">7</div><div class="drum-num">8</div><div class="drum-num">9</div>
                </div>
            </div>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="main-page">
        <div class="hero-container">
            
            <!-- الكلمة اللي الصقر هيكشفها (في اليمين) -->
            <div class="hero-word-main" id="heroWordMain">
                <img src="icon/Word.png" alt="Falcon" class="notranslate" translate="no">
            </div>

            <!-- الشخص والتاج (في الشمال) -->
            <div class="character-group" id="characterGroup">
                <img src="icon/Person.png" alt="Person" class="person-img notranslate" translate="no">
                <img src="icon/Crown.png" alt="Crown" class="crown-img notranslate" translate="no">
            </div>

            <!-- الصقر الطائر -->
            <div class="falcon-group" id="falconGroup">
                <img src="icon/falcon.png" alt="Flying Falcon" class="falcon-img notranslate" translate="no">
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
